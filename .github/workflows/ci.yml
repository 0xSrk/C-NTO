name: check
on:
  push:
  pull_request:
  # Lancé à la main : la CI dépose aussi les installeurs (artefacts de 3 jours).
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Avis de sécurité (dépendances embarquées)
        shell: bash
        run: |
          set -uo pipefail
          # Le point d'audit rapide de npm renvoie parfois un 400 « Invalid package tree »
          # alors que le lockfile est valide (l'endpoint est en cours de retrait).
          # On réessaie seulement cette erreur de registre ; une vraie alerte reste fatale.
          for attempt in 1 2 3; do
            set +e
            log=$(npm audit --omit=dev --audit-level=high 2>&1)
            code=$?
            set -e
            printf '%s\n' "$log"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if printf '%s\n' "$log" | grep -Eq "audit endpoint returned an error|Invalid package tree"; then
              echo "Registre npm injoignable ou arbre rejeté (tentative ${attempt}/3)."
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
              continue
            fi
            exit "$code"
          done
          exit 1
      - run: npm run typecheck
      - run: npm test
        env:
          TZ: UTC
      - run: npm run build

  dist:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifact: canto-linux
          - os: windows-latest
            script: dist:win
            artifact: canto-windows
          - os: macos-latest
            script: dist:mac
            artifact: canto-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Installeur natif
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          set -uo pipefail
          # Le zip Electron (GitHub) répond parfois 500 une fois le téléchargement annoncé.
          # On ne réessaie que cette coupure réseau ; une erreur de build reste fatale.
          for attempt in 1 2 3; do
            set +e
            log=$(npm run "${{ matrix.script }}" 2>&1)
            code=$?
            set -e
            printf '%s\n' "$log"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if printf '%s\n' "$log" | grep -Eq "Response code 500|ECONNRESET|ETIMEDOUT|EAI_AGAIN|socket hang up"; then
              echo "Téléchargement Electron interrompu (tentative ${attempt}/3)."
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 15))
              fi
              continue
            fi
            exit "$code"
          done
          exit 1
      # Un jeu d'installeurs pèse près de 2 Go : envoyé à chaque push et à chaque PR, gardé 90 jours,
      # il a rempli le quota de stockage des artefacts et bloqué la 3.6.0. Construits à chaque passage,
      # ils ne sont envoyés que sur demande (« Run workflow »), et pour 3 jours.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 3
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
