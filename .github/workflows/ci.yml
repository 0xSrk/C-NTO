name: check
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Avis de sécurité (dépendances embarquées)
        shell: bash
        run: |
          set -uo pipefail
          # Le point d'audit rapide de npm renvoie parfois un 400 « Invalid package tree »
          # alors que le lockfile est valide (l'endpoint est en cours de retrait).
          # On réessaie seulement cette erreur de registre ; une vraie alerte reste fatale.
          for attempt in 1 2 3; do
            set +e
            log=$(npm audit --omit=dev --audit-level=high 2>&1)
            code=$?
            set -e
            printf '%s\n' "$log"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if printf '%s\n' "$log" | grep -Eq "audit endpoint returned an error|Invalid package tree"; then
              echo "Registre npm injoignable ou arbre rejeté (tentative ${attempt}/3)."
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
              continue
            fi
            exit "$code"
          done
          exit 1
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dist:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifact: canto-linux
          - os: windows-latest
            script: dist:win
            artifact: canto-windows
          - os: macos-latest
            script: dist:mac
            artifact: canto-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Installeur natif
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
