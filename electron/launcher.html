<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'" />
    <title>CΛNTO</title>
    <style>
      :root {
        /* Jetons du Système 4.0 « ΟΡΟΣ » (src/design/tokens.css) : la seule place des couleurs du lanceur. */
        color-scheme: dark only;
        --bg-0: #07080c;
        --bg-1: #0d0e12;
        --bg-2: #14151a;
        --bg-3: #1c1d23;
        --line-1: #25262c;
        --line-2: #36373f;
        --line-3: #4b4e57;
        --text-0: #f5f2ea;
        --text-1: #b9b4a9;
        --text-2: #8f8a80;
        --ivory: #f5f2ea;
        --stone: #e6e2da;
        --ink: #0b0b0b;
        --ink-soft: #5e5b55;
        --gold: #ccb066;
        --signal: #e10600;
        --gold-soft: rgba(204, 176, 102, 0.12);
        --gold-line: rgba(204, 176, 102, 0.45);
        --gold-glow: 0 0 0 1px rgba(204, 176, 102, 0.35), 0 0 6px rgba(204, 176, 102, 0.55), 0 0 18px rgba(204, 176, 102, 0.28);
        --scan: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px);
        --dots: radial-gradient(circle, var(--line-3) 0.8px, transparent 1.1px) 0 50% / 5px 3px repeat-x;
        --dots-ink: radial-gradient(circle, var(--ink-soft) 0.8px, transparent 1.1px) 0 50% / 5px 3px repeat-x;

        /* Voix : Instrument Sans parle, Geist Mono étiquette, IBM Plex Sans porte le nom et le grec. */
        --font-ui: 'Instrument Sans', 'IBM Plex Sans', system-ui, sans-serif;
        --font-mono: 'Geist Mono', 'IBM Plex Sans', ui-monospace, monospace;
        --font-name: 'IBM Plex Sans', 'Instrument Sans', sans-serif;
        --f-mono: var(--font-mono);
        --f-name: var(--font-name);
        --f-disp: var(--font-ui);
        /* Micrographies : encre et papier par zone. */
        --k: var(--text-2);
        --p: var(--bg-0);

        /* Géométrie de la fenêtre 420 × 620 : l'horizon, le logotype (640 × 160 → 320 × 80, axe y 80 sur l'horizon). */
        --H: 244px;
        --word-w: 320px;
        --chamfer: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      }

      @font-face {
        font-family: 'Instrument Sans';
        font-style: normal;
        font-display: block;
        font-weight: 400 700;
        font-stretch: 75% 100%;
        src: url(./fonts/instrument-sans-latin-wdth-normal.woff2) format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Geist Mono';
        font-style: normal;
        font-display: block;
        font-weight: 100 900;
        src: url(./fonts/geist-mono-latin-wght-normal.woff2) format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-display: block;
        font-weight: 500;
        src: url(./fonts/ibm-plex-sans-greek-500-normal.woff2) format('woff2');
        unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-display: block;
        font-weight: 500;
        src: url(./fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--bg-0);
        color: var(--text-1);
        font-family: var(--font-ui);
        font-feature-settings: 'tnum';
        font-kerning: normal;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        border-radius: 0;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      button:focus-visible {
        outline: 1px solid var(--gold);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      /* ─── Calque vectoriel de l'aube (aube.js) : graduation de l'horizon, lumière de la LED, couture du départ ─── */
      .aube {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      .aube canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .frame {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      /* Balayage du Système 4.0 : un calque fixe, sous les plaques. */
      .frame::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--scan);
        opacity: 0.5;
        pointer-events: none;
      }
      .frame.leaving {
        pointer-events: none;
      }

      /* Repères de calage aux quatre coins du cadre. */
      .cross {
        position: absolute;
        width: 9px;
        height: 9px;
        background:
          linear-gradient(var(--line-3), var(--line-3)) 4px 0 / 1px 9px no-repeat,
          linear-gradient(var(--line-3), var(--line-3)) 0 4px / 9px 1px no-repeat;
      }
      .cross.tl {
        top: 8px;
        left: 8px;
      }
      .cross.tr {
        top: 8px;
        right: 8px;
      }
      .cross.bl {
        bottom: 32px;
        left: 8px;
      }
      .cross.br {
        bottom: 32px;
        right: 8px;
      }

      /* ─── Barre de titre ─── */
      .title {
        position: absolute;
        left: 24px;
        right: 16px;
        top: 12px;
        height: 24px;
        display: flex;
        align-items: center;
        gap: 8px;
        font: 500 10px/1 var(--font-mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-2);
        white-space: nowrap;
      }
      .title b {
        font-family: var(--font-name);
        font-weight: 500;
        letter-spacing: 0.12em;
        color: var(--text-0);
      }
      .title .sp {
        flex: 1;
      }
      .close {
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        color: var(--text-2);
      }
      .close:active {
        color: var(--text-0);
      }
      .close svg {
        display: block;
        shape-rendering: crispEdges;
      }

      /* ─── Plaques : relevés réels, l'encre en graphite, la valeur liée en ivoire ─── */
      .plate {
        position: absolute;
        line-height: 0;
      }
      .plate svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
        font-family: var(--f-mono);
        font-weight: 450;
      }
      .plate text {
        font-kerning: normal;
      }
      .plate .lm-v {
        fill: var(--text-0);
      }
      /* Le ciel : les deux plaques se tiennent sur l'horizon, à 52 px au-dessus de lui. */
      .p-seal {
        left: 24px;
        bottom: calc(100% - var(--H) + 52px);
        width: 140px;
      }
      .p-artefact {
        right: 24px;
        bottom: calc(100% - var(--H) + 52px);
        width: 168px;
      }
      .p-release {
        left: 34px;
        right: 34px;
        top: calc(var(--H) + 68px);
      }

      /* ─── L'horizon : la lentille du sceau, à l'échelle de la fenêtre ─── */
      .lens {
        position: absolute;
        left: 0;
        width: 100%;
        top: calc(var(--H) - 1px);
        height: 2.6px;
        display: block;
        overflow: visible;
        color: var(--text-0);
        opacity: 0.9;
      }

      /* ─── Logotype : grille 640 × 160, axe y 80 sur l'horizon ─── */
      .word {
        position: absolute;
        left: calc(50% - var(--word-w) / 2);
        top: calc(var(--H) - var(--word-w) / 8);
        width: var(--word-w);
        height: calc(var(--word-w) / 4);
        display: block;
        overflow: visible;
        color: var(--text-0);
        transform-origin: 50% 50%;
        transition: transform 0.28s var(--ease-in-out), opacity 0.2s linear 0.12s;
      }
      .word .halo {
        opacity: 0.16;
        filter: blur(2.6px);
      }
      .word .glint path {
        stroke-dasharray: 0.05 0.95;
        stroke-dashoffset: 1.05;
        opacity: 0;
      }
      .frame.leaving .word .glint path {
        animation: glint 0.62s cubic-bezier(0.5, 0, 0.2, 1) forwards;
        animation-delay: calc(var(--i) * 0.05s);
      }
      .frame.collapse .word {
        transform: scaleY(0.02);
        opacity: 0;
      }

      /* La LED de relais : posée sur la pointe du Λ (208, 30 sur la grille). */
      .led {
        position: absolute;
        left: calc(50% + (208 - 320) * var(--word-w) / 640 - 2.5px);
        top: calc(var(--H) + (30 - 80) * var(--word-w) / 640 - 2.5px);
        width: 5px;
        height: 5px;
        background: var(--gold);
        box-shadow: var(--gold-glow);
      }

      .lab {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(var(--H) + 34px);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        font: 500 10px/1 var(--font-mono);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--text-2);
        white-space: nowrap;
      }
      .lab b {
        font-family: var(--font-name);
        font-weight: 500;
        letter-spacing: 0.16em;
        color: var(--text-1);
      }
      .lab i {
        width: 4px;
        height: 4px;
        background: var(--gold);
      }

      /* ─── Commandes : la langue, l'action principale, la mise à jour ─── */
      .panel {
        position: absolute;
        left: 24px;
        right: 24px;
        top: 372px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        -webkit-app-region: no-drag;
      }
      .rule {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 12px;
        font: 500 10px/1 var(--font-mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-2);
      }
      .rule::after {
        content: '';
        flex: 1;
        height: 3px;
        background: var(--dots);
      }
      .lang-row {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        height: 32px;
        border: 1px solid var(--line-2);
      }
      .lang-row button {
        position: relative;
        z-index: 1;
        font: 500 10px/1 var(--font-mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-1);
        transition: color 160ms linear;
      }
      .lang-row button + button {
        box-shadow: inset 1px 0 0 var(--line-2);
      }
      .lang-row button.on {
        color: var(--ink);
      }
      /* L'onglet poinçonné : l'ivoire glisse sous la langue choisie. */
      .lang-row .thumb {
        position: absolute;
        z-index: 0;
        top: 0;
        bottom: 0;
        left: 0;
        width: calc(100% / 3);
        background: var(--ivory);
        transform: translateX(calc(var(--at, 0) * 100%));
        transition: transform 0.32s var(--ease);
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 4px;
      }
      .btn {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 44px;
        padding: 0 16px;
        font: 600 14px/1 var(--font-ui);
        letter-spacing: -0.005em;
        text-align: left;
        overflow: hidden;
      }
      .btn .label {
        flex: 1;
      }
      .btn .g {
        width: 14px;
        height: 14px;
        line-height: 0;
      }
      .btn .g svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* L'action principale : chanfrein, fond ivoire, texte nuit, la flèche d'ouverture de la planche. */
      .btn.primary {
        background: var(--ivory);
        color: var(--ink);
        clip-path: var(--chamfer);
        --k: var(--ink);
      }
      .btn.primary:active:not(:disabled) {
        background: var(--stone);
      }
      /* Désactivée (une mise à jour s'applique) : la plaque d'ivoire se retire en filet, sans bloc gris. */
      .btn.primary:disabled {
        opacity: 1;
        background: transparent;
        color: var(--text-2);
        box-shadow: inset 0 0 0 1px var(--line-2);
        --k: var(--text-2);
      }
      /* La mise à jour vit : filet or, flèche d'import en or. */
      .btn.update {
        height: 40px;
        font-size: 13px;
        color: var(--text-0);
        box-shadow: inset 0 0 0 1px var(--gold);
        --k: var(--gold);
      }
      .btn.update:active:not(:disabled) {
        background: var(--gold-soft);
      }
      .btn.update.busy {
        box-shadow: inset 0 0 0 1px var(--gold-line);
      }

      /* ─── Pied d'état : la jauge, le signal, les nouveautés — calés au-dessus de la bande ─── */
      .status {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 28px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        -webkit-app-region: no-drag;
      }
      /* Jauge du téléchargement : la règle de la planche, une séquence de points qui se remplit d'or. */
      .gauge {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 12px;
        --fill: 0;
      }
      .gauge .g {
        width: 30px;
        height: 3px;
        line-height: 0;
        --k: var(--text-2);
      }
      .gauge .g svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .gauge .track {
        position: relative;
        flex: 1;
        height: 12px;
        box-shadow:
          inset 1px 0 0 var(--text-2),
          inset -1px 0 0 var(--text-2);
      }
      .gauge .track::before,
      .gauge .track i {
        content: '';
        position: absolute;
        left: 3px;
        top: 4px;
        height: 4px;
      }
      .gauge .track::before {
        right: 3px;
        background: radial-gradient(circle, var(--line-3) 1px, transparent 1.4px) 0 50% / 6px 4px repeat-x;
      }
      .gauge .track i {
        width: calc((100% - 6px) * var(--fill));
        background: radial-gradient(circle, var(--gold) 1.4px, transparent 1.8px) 0 50% / 6px 4px repeat-x;
      }
      .gauge .track::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: repeating-linear-gradient(90deg, var(--text-2) 0 1px, transparent 1px 10%);
      }
      .gauge b {
        min-width: 36px;
        font: 500 10px/1 var(--font-mono);
        letter-spacing: 0.08em;
        text-align: right;
        color: var(--text-0);
      }

      /* Signal : la forme dit le niveau — 1 orbite, 2 rayonnement, 3 cercle barré (seul rouge) ; l'anneau tourne pendant un contrôle. */
      .meta {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        min-height: 16px;
        font: 500 11px/15px var(--font-mono);
        letter-spacing: 0.02em;
        color: var(--text-1);
        user-select: text;
      }
      .meta .sg {
        position: relative;
        flex: none;
        width: 15px;
        height: 15px;
        line-height: 0;
        --k: var(--text-1);
      }
      .meta .sg svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .meta[data-level='1'] .sg {
        width: 19px;
      }
      .meta .sg .g131-1,
      .meta .sg .g131-2 {
        stroke-width: 6px;
      }
      .meta[data-level='2'] .sg {
        --k: var(--text-0);
      }
      .meta[data-level='2'] .txt,
      .meta[data-level='3'] .txt {
        color: var(--text-0);
      }
      /* Le rouge marque, il n'écrit jamais : le glyphe seul prend le signal. */
      .meta[data-level='3'] .sg {
        --k: var(--signal);
      }
      .meta[data-level='busy'] .sg::after {
        content: '';
        position: absolute;
        left: 6px;
        top: 0.4px;
        width: 3px;
        height: 3px;
        background: var(--gold);
        transform-origin: 1.5px 7.1px;
        animation: tick 1.2s steps(12, end) infinite;
      }
      .meta .txt {
        min-width: 0;
      }
      .meta::after {
        content: '';
        flex: 1;
        min-width: 16px;
        height: 3px;
        margin-top: 6px;
        background: var(--dots);
      }
      .notes-slot {
        min-height: 16px;
      }
      .notes-toggle {
        font: 500 11px/16px var(--font-mono);
        letter-spacing: 0.02em;
        color: var(--text-1);
        text-align: left;
      }
      .notes-toggle:active,
      .notes-toggle[aria-expanded='true'] {
        color: var(--text-0);
      }

      /* ─── Nouveautés : une fiche, le papier du Lab sorti sur la nuit ─── */
      .notes {
        position: absolute;
        z-index: 4;
        left: 24px;
        right: 24px;
        top: 48px;
        height: 316px;
        overflow: auto;
        padding: 0 16px 14px;
        background: var(--ivory);
        color: var(--ink);
        clip-path: var(--chamfer);
        font: 400 12px/1.45 var(--font-ui);
        user-select: text;
        -webkit-app-region: no-drag;
        scrollbar-width: thin;
        scrollbar-color: var(--ink-soft) var(--ivory);
      }
      .notes .fh {
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        height: 32px;
        margin: 0 -16px 4px;
        padding: 0 16px;
        background: var(--ivory);
        box-shadow: inset 0 -1px 0 var(--ink);
        font: 600 10px/1 var(--font-mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .notes .fh span + span {
        text-transform: none;
        letter-spacing: 0.08em;
      }
      .notes .ver {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 12px 0 4px;
        font: 600 10px/1 var(--font-mono);
        letter-spacing: 0.12em;
        color: var(--ink);
      }
      .notes .ver::after {
        content: '';
        flex: 1;
        height: 3px;
        background: var(--dots-ink);
      }
      .notes ul {
        list-style: none;
      }
      .notes li {
        position: relative;
        padding-left: 14px;
      }
      .notes li::before {
        content: '';
        position: absolute;
        left: 2px;
        top: 0.62em;
        width: 4px;
        height: 4px;
        background: var(--ink-soft);
      }
      .notes li + li {
        margin-top: 3px;
      }

      /* ─── Bande d'étiquette : le canal, et le seul code-barres, en bas à droite ─── */
      .strip {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 24px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        background: var(--ivory);
        color: var(--ink);
        font: 500 10px/1 var(--font-mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .strip .sp {
        flex: 1;
      }
      .strip .soft {
        color: var(--ink-soft);
      }
      .code {
        display: block;
        height: 12px;
      }
      .btn[hidden],
      .gauge[hidden],
      .notes[hidden],
      .notes-toggle[hidden] {
        display: none;
      }

      /* Départ : tout se retire sauf le logotype et l'horizon. */
      .frame.leaving .title,
      .frame.leaving .plate,
      .frame.leaving .lab,
      .frame.leaving .panel,
      .frame.leaving .status,
      .frame.leaving .notes,
      .frame.leaving .strip {
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.22s linear, transform 0.3s var(--ease);
      }
      .frame.leaving .strip {
        transform: none;
      }

      /* ─── Télémétrie du départ ─── */
      .xfer {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        visibility: hidden;
      }
      .xfer.on {
        visibility: visible;
      }
      .xfer canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .hud {
        position: absolute;
        left: 24px;
        right: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        font: 500 10px/1 var(--font-mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-2);
        opacity: 0;
        transition: opacity 0.3s linear 0.2s;
      }
      .xfer.on .hud {
        opacity: 1;
      }
      .hud.top-hud {
        top: 19px;
      }
      .hud.bottom-hud {
        bottom: 40px;
      }
      .hud .fill {
        position: relative;
        flex: 1;
        height: 3px;
        background: var(--dots);
        overflow: hidden;
      }
      .hud .fill span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: radial-gradient(circle, var(--gold) 1px, transparent 1.3px) 0 50% / 5px 3px repeat-x;
      }
      .hud b {
        color: var(--text-0);
        font-weight: 500;
      }
      .hud .led-mark {
        color: var(--gold);
      }

      @keyframes glint {
        0% {
          stroke-dashoffset: 1.05;
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 0;
        }
      }
      @keyframes tick {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .meta[data-level='busy'] .sg::after {
          animation: none;
        }
        .lang-row .thumb,
        .word {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="aube" id="aube" aria-hidden="true"><canvas id="aube-vec"></canvas></div>

    <div class="frame" id="frame">
      <i class="cross tl" aria-hidden="true"></i>
      <i class="cross tr" aria-hidden="true"></i>
      <i class="cross bl" aria-hidden="true"></i>
      <i class="cross br" aria-hidden="true"></i>

      <header class="title">
        <b>CΛNTO</b><span>/ 002 · AUBE</span>
        <span class="sp"></span>
        <button type="button" class="close" id="btn-close" aria-label="Fermer" title="Fermer">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" /></svg>
        </button>
      </header>

      <div class="plate p-seal" id="plate-seal" aria-hidden="true"></div>
      <div class="plate p-artefact" id="plate-artefact" aria-hidden="true"></div>

      <svg class="lens" id="lens" viewBox="-404 -23 808 27" preserveAspectRatio="none" fill="currentColor" aria-hidden="true"></svg>

      <svg class="word" id="word" viewBox="0 0 640 160" fill="none" role="img" aria-label="CΛNTO">
        <g class="halo" stroke="currentColor" stroke-width="6.5" stroke-linecap="square">
          <path d="M121.49 37.57 A49.5 49.5 0 1 0 121.49 122.43" />
          <path d="M160 128 L208 30 L256 128" />
          <path d="M288 128 L288 32 L368 128 L368 32" />
          <path d="M400 32 L496 32 M448 32 L448 128" />
          <path d="M544 30.5 A49.5 49.5 0 1 1 544 129.5 A49.5 49.5 0 1 1 544 30.5" />
        </g>
        <g class="core" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="4">
          <path pathLength="1" style="--i: 0" d="M121.49 37.57 A49.5 49.5 0 1 0 121.49 122.43" />
          <path pathLength="1" style="--i: 1" d="M160 128 L208 30 L256 128" />
          <path pathLength="1" style="--i: 2" d="M288 128 L288 32 L368 128 L368 32" />
          <path pathLength="1" style="--i: 3" d="M400 32 L496 32 M448 32 L448 128" />
          <path pathLength="1" style="--i: 4" d="M544 30.5 A49.5 49.5 0 1 1 544 129.5 A49.5 49.5 0 1 1 544 30.5" />
        </g>
        <g class="glint" stroke="currentColor" stroke-width="5" stroke-linecap="round">
          <path pathLength="1" style="--i: 0" d="M121.49 37.57 A49.5 49.5 0 1 0 121.49 122.43" />
          <path pathLength="1" style="--i: 1" d="M160 128 L208 30 L256 128" />
          <path pathLength="1" style="--i: 2" d="M288 128 L288 32 L368 128 L368 32" />
          <path pathLength="1" style="--i: 3" d="M400 32 L496 32 M448 32 L448 128" />
          <path pathLength="1" style="--i: 4" d="M544 30.5 A49.5 49.5 0 1 1 544 129.5 A49.5 49.5 0 1 1 544 30.5" />
        </g>
      </svg>
      <i class="led" id="led" aria-hidden="true"></i>

      <p class="lab"><b>SIΞRRΛSKΛ</b><span>LAB</span><i aria-hidden="true"></i><span>ARTEFACT 002</span></p>

      <div class="plate p-release" id="plate-release" aria-hidden="true"></div>

      <div class="notes" id="notes-panel" hidden></div>

      <div class="panel">
        <div class="rule" id="lang-label">Langue du desk</div>
        <div class="lang-row" role="radiogroup" id="lang-row">
          <i class="thumb" aria-hidden="true"></i>
          <button type="button" data-locale="fr" role="radio">Français</button>
          <button type="button" data-locale="en" role="radio">English</button>
          <button type="button" data-locale="es" role="radio">Español</button>
        </div>
        <div class="actions">
          <button type="button" class="btn primary" id="btn-launch">
            <span class="label" id="btn-launch-label">Lancer le desk</span>
            <span class="g" id="glyph-launch" aria-hidden="true"></span>
          </button>
          <button type="button" class="btn update" id="btn-update" hidden>
            <span class="label" id="btn-update-label">Mettre à jour</span>
            <span class="g" id="glyph-update" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <div class="status">
        <div class="gauge" id="gauge" hidden aria-hidden="true">
          <span class="g" id="glyph-rule"></span>
          <span class="track"><i></i></span>
          <b id="gauge-pct">0 %</b>
        </div>
        <p class="meta" id="meta" data-level="busy"><span class="sg" id="meta-glyph" aria-hidden="true"></span><span class="txt" id="meta-text">Contrôle de version…</span></p>
        <div class="notes-slot" id="notes-slot">
          <button type="button" class="notes-toggle" id="notes-toggle" hidden aria-expanded="false" aria-controls="notes-panel"></button>
        </div>
      </div>

      <footer class="strip">
        <span id="strip-channel">□ —</span>
        <span class="soft" id="strip-latency"></span>
        <span class="sp"></span>
        <span id="strip-code">SK-ART-002</span>
        <svg class="code" id="code" height="12" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true" focusable="false"></svg>
      </footer>
    </div>

    <div class="xfer" id="xfer" aria-hidden="true">
      <canvas id="nano"></canvas>
      <div class="hud top-hud">
        <span>CΛNTO <span class="led-mark">/</span> 002 · LINK</span>
        <span style="flex: 1"></span>
        <b id="hud-clock">T+0.000</b>
      </div>
      <div class="hud bottom-hud">
        <span id="hud-text">Liaison du circuit</span>
        <span class="fill"><span id="hud-fill"></span></span>
        <b id="hud-count">000</b>
      </div>
    </div>

    <script src="./launcher-micro.js"></script>
    <script src="./aube.js"></script>
    <script src="./launcher-ui.js"></script>
  </body>
</html>
