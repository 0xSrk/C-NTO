<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'" />
    <title>CΛNTO</title>
    <style>
      :root {
        color-scheme: dark only;
        --bg: #000000;
        --text-0: #ffffff;
        --text-1: #c4c4c4;
        --text-2: #7a7a7a;
        --text-3: #5a5a5a;
        --line: rgba(255, 255, 255, 0.1);
        --line-fine: rgba(255, 255, 255, 0.06);
        --led: #c41e3a;
        --amber: #d8b45a;
        --font: 'Segoe UI', 'Helvetica Neue', sans-serif;
        --mono: 'Cascadia Mono', 'Consolas', ui-monospace, monospace;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text-1);
        font-family: var(--font);
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
      }
      .frame {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 28px 32px 24px;
        position: relative;
        transition: opacity 0.55s var(--ease), transform 0.7s var(--ease);
      }
      .frame::before,
      .frame::after,
      .frame .c-bl,
      .frame .c-br {
        position: absolute;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text-3);
        -webkit-app-region: no-drag;
        line-height: 1;
      }
      .frame::before {
        content: '+';
        top: 10px;
        left: 10px;
      }
      .frame::after {
        content: '+';
        top: 10px;
        right: 10px;
      }
      .frame .c-bl {
        content: '+';
        bottom: 10px;
        left: 10px;
      }
      .frame .c-br {
        bottom: 10px;
        right: 10px;
      }
      .frame.leaving {
        opacity: 0;
        transform: scale(0.985);
        pointer-events: none;
      }
      .chrome {
        display: flex;
        justify-content: flex-end;
        -webkit-app-region: no-drag;
        margin: -8px -12px 8px 0;
      }
      .chrome button {
        width: 40px;
        height: 32px;
        border: 0;
        background: transparent;
        color: var(--text-2);
        cursor: pointer;
      }
      .chrome button:hover {
        color: var(--text-0);
        background: #0a0a0a;
      }
      .chrome button.x:hover {
        background: var(--led);
        color: #000;
      }
      .brand {
        margin-top: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        flex: 1;
        justify-content: center;
        transition: opacity 0.4s var(--ease);
      }
      .frame.leaving .brand {
        opacity: 0;
      }
      .mark {
        width: 72px;
        height: 72px;
        display: block;
        border: 1px solid var(--line-fine);
      }
      .word {
        width: 200px;
        height: auto;
      }
      .word path {
        stroke-width: 1;
      }
      .lab {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-2);
      }
      .lab b {
        color: var(--led);
        font-weight: 600;
      }
      .actions {
        -webkit-app-region: no-drag;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: auto;
        transition: opacity 0.35s var(--ease);
      }
      .frame.leaving .actions,
      .frame.leaving .meta {
        opacity: 0;
      }
      .btn {
        height: 44px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text-0);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 120ms linear, border-color 120ms linear, color 120ms linear;
      }
      .btn:hover:not(:disabled) {
        background: #080808;
        border-color: rgba(255, 255, 255, 0.22);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .btn.primary {
        background: var(--text-0);
        color: #000;
        border-color: var(--text-0);
      }
      .btn.primary:hover:not(:disabled) {
        background: #e8e8e8;
      }
      .btn.update {
        border-color: var(--amber);
        color: var(--amber);
      }
      .btn.update:hover:not(:disabled) {
        background: rgba(216, 180, 90, 0.08);
      }
      .btn.update.busy {
        opacity: 0.7;
      }
      .meta {
        margin-top: 14px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        color: var(--text-2);
        text-align: center;
        min-height: 28px;
        line-height: 1.4;
        -webkit-app-region: no-drag;
        transition: opacity 0.35s var(--ease);
      }
      .meta.warn {
        color: var(--amber);
      }
      .meta.err {
        color: #e07070;
      }
      .lang {
        -webkit-app-region: no-drag;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 8px;
      }
      .lang-label {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-2);
        text-align: center;
      }
      .lang-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
      }
      .lang-row button {
        height: 36px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text-1);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .lang-row button:hover {
        border-color: rgba(255, 255, 255, 0.22);
        color: var(--text-0);
      }
      .lang-row button.on {
        background: var(--text-0);
        color: #000;
        border-color: var(--text-0);
      }

      /* ─── Transition : traits symétriques + nano-circuit ─── */
      .xfer {
        position: fixed;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        opacity: 0;
        background: #000;
      }
      .xfer.on {
        opacity: 1;
        transition: opacity 0.2s linear;
      }
      .xfer svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .xfer .trace {
        fill: none;
        stroke: rgba(255, 255, 255, 0.18);
        stroke-width: 0.75;
        stroke-linecap: square;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .xfer.on .trace {
        animation: draw 0.9s var(--ease) forwards;
      }
      .xfer .trace.led {
        stroke: rgba(196, 30, 58, 0.5);
        stroke-width: 0.85;
      }
      .xfer .inset {
        fill: none;
        stroke: rgba(255, 255, 255, 0.07);
        stroke-width: 0.75;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        opacity: 1;
      }
      .xfer.on .inset {
        animation: draw 0.75s var(--ease) 0.12s forwards;
      }
      .xfer .node {
        fill: rgba(255, 255, 255, 0.4);
        opacity: 0;
      }
      .xfer .node.led {
        fill: var(--led);
      }
      .xfer.on .node {
        animation: node-in 0.22s linear forwards;
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes node-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .xfer canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        mix-blend-mode: screen;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="frame" id="frame">
      <span class="c-bl" aria-hidden>+</span>
      <span class="c-br" aria-hidden>+</span>
      <div class="chrome">
        <button type="button" class="x" id="btn-close" aria-label="Fermer" title="Fermer">✕</button>
      </div>
      <div class="brand">
        <img class="mark" src="./logo.svg" width="72" height="72" alt="" aria-hidden="true" />
        <svg class="word" viewBox="0 0 640 160" fill="none" aria-label="CΛNTO">
          <g stroke="#ffffff" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="2">
            <path d="M136 40 A48 48 0 1 0 136 120" />
            <path d="M176 128 L224 32 L272 128" />
            <path d="M304 128 L304 32 L384 128 L384 32" />
            <path d="M416 32 L512 32 M464 32 L464 128" />
            <path d="M560 32 A48 48 0 1 1 560 128 A48 48 0 1 1 560 32" />
          </g>
        </svg>
        <div class="lab">SIΞRRΛSKΛ—LAB · <b>Artefact 002</b></div>
      </div>
      <div class="lang" id="lang">
        <div class="lang-label" id="lang-label">Langue du desk</div>
        <div class="lang-row" role="radiogroup" id="lang-row">
          <button type="button" data-locale="fr" role="radio">Français</button>
          <button type="button" data-locale="en" role="radio">English</button>
          <button type="button" data-locale="es" role="radio">Español</button>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn primary" id="btn-launch">Lancer le desk</button>
        <button type="button" class="btn" id="btn-update" hidden>Mettre à jour</button>
      </div>
      <p class="meta" id="meta">Contrôle de version…</p>
    </div>

    <div class="xfer" id="xfer" aria-hidden="true">
      <svg viewBox="0 0 420 560" preserveAspectRatio="none">
        <!-- Cadres incrustés -->
        <rect class="inset" x="24" y="24" width="372" height="512" pathLength="1" />
        <rect class="inset" x="48" y="48" width="324" height="464" pathLength="1" style="animation-delay: 0.28s" />
        <!-- Traits horizontaux symétriques -->
        <path class="trace" pathLength="1" d="M0 180 H210" style="animation-delay: 0.05s" />
        <path class="trace" pathLength="1" d="M420 180 H210" style="animation-delay: 0.05s" />
        <path class="trace" pathLength="1" d="M0 280 H210" style="animation-delay: 0.18s" />
        <path class="trace" pathLength="1" d="M420 280 H210" style="animation-delay: 0.18s" />
        <path class="trace" pathLength="1" d="M0 380 H210" style="animation-delay: 0.3s" />
        <path class="trace" pathLength="1" d="M420 380 H210" style="animation-delay: 0.3s" />
        <!-- Traits verticaux -->
        <path class="trace" pathLength="1" d="M140 0 V560" style="animation-delay: 0.12s" />
        <path class="trace" pathLength="1" d="M280 0 V560" style="animation-delay: 0.12s" />
        <!-- Filets LED -->
        <path class="trace led" pathLength="1" d="M210 80 V480" style="animation-delay: 0.35s" />
        <path class="trace led" pathLength="1" d="M80 280 H340" style="animation-delay: 0.42s" />
        <!-- Nano nœuds (1×1 px) -->
        <rect class="node" x="209.5" y="179.5" width="1" height="1" style="animation-delay: 0.55s" />
        <rect class="node led" x="209.5" y="279.5" width="1" height="1" style="animation-delay: 0.62s" />
        <rect class="node" x="209.5" y="379.5" width="1" height="1" style="animation-delay: 0.7s" />
        <rect class="node" x="139.5" y="279.5" width="1" height="1" style="animation-delay: 0.58s" />
        <rect class="node" x="279.5" y="279.5" width="1" height="1" style="animation-delay: 0.58s" />
        <rect class="node led" x="139.5" y="179.5" width="1" height="1" style="animation-delay: 0.66s" />
        <rect class="node led" x="279.5" y="179.5" width="1" height="1" style="animation-delay: 0.66s" />
        <rect class="node" x="139.5" y="379.5" width="1" height="1" style="animation-delay: 0.74s" />
        <rect class="node" x="279.5" y="379.5" width="1" height="1" style="animation-delay: 0.74s" />
        <rect class="node" x="79.5" y="279.5" width="1" height="1" style="animation-delay: 0.68s" />
        <rect class="node" x="339.5" y="279.5" width="1" height="1" style="animation-delay: 0.68s" />
        <rect class="node led" x="209.5" y="79.5" width="1" height="1" style="animation-delay: 0.78s" />
        <rect class="node led" x="209.5" y="479.5" width="1" height="1" style="animation-delay: 0.78s" />
      </svg>
      <canvas id="nano" width="420" height="560"></canvas>
    </div>
    <script src="./launcher-ui.js"></script>
  </body>
</html>
